name: Wombat
options:
  bundleIdPrefix: net.vpetkov
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TunnelCore:
    path: Packages/TunnelCore
  # Self-updates for the Developer ID app (feed: wombat.vpetkov.net/appcast.xml). Same version
  # as Moo; bump on purpose.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.9.6 by commit, not by tag: a tag can be moved, and this code runs Sparkle's signing tools
    # with the EdDSA key (review SEC-8). Package.resolved isn't committed (*.xcodeproj is generated).
    revision: ac2def288cbff5cfc7df3ffef6abdf45b72bcb0a

settings:
  base:
    DEVELOPMENT_TEAM: 8J9W3ZG4ZN
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.3.0
    CURRENT_PROJECT_VERSION: 30
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    APP_DISPLAY_NAME: Wombat
    APP_BUNDLE_ID: net.vpetkov.wombat
  configs:
    Debug:
      APP_DISPLAY_NAME: Wombat Debug
      APP_BUNDLE_ID: net.vpetkov.wombat.debug
      ONLY_ACTIVE_ARCH: YES
      # Development profiles only carry the plain value; Developer ID needs the -systemextension one.
      NE_PACKET_TUNNEL: packet-tunnel-provider
    Release:
      ONLY_ACTIVE_ARCH: NO
      NE_PACKET_TUNNEL: packet-tunnel-provider-systemextension

targets:
  Wombat:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Resources
        buildPhase: resources
      # Shell completion scripts, as a folder: Contents/Resources/completions, where the Homebrew
      # cask links them from and `wombat completion` reads them.
      - path: completions
        type: folder
        buildPhase: resources
    dependencies:
      - package: TunnelCore
      - package: Sparkle
      # Built first, embedded by the script below: XcodeGen resolves the product file name once,
      # from the first configuration, so its copy phase looked for the Debug name in Release.
      - target: WombatTunnel
        embed: false
      - target: WombatOpenConnect
        embed: false
      - target: wombat-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    postCompileScripts:
      - name: Embed system extension
        script: |
          set -euo pipefail
          dest="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Library/SystemExtensions"
          mkdir -p "$dest"
          for ext in "$APP_BUNDLE_ID.tunnel.systemextension" "$APP_BUNDLE_ID.openconnect.systemextension"; do
            /bin/rm -rf "$dest/$ext"
            /usr/bin/ditto "$BUILT_PRODUCTS_DIR/$ext" "$dest/$ext"
          done
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(APP_BUNDLE_ID).tunnel.systemextension
          - $(BUILT_PRODUCTS_DIR)/$(APP_BUNDLE_ID).openconnect.systemextension
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/SystemExtensions/$(APP_BUNDLE_ID).tunnel.systemextension
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/SystemExtensions/$(APP_BUNDLE_ID).openconnect.systemextension
    settings:
      base:
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: Wombat
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Wombat.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # The embed script reads the extension through BUILT_PRODUCTS_DIR, which archives make a
        # symlink into UninstalledProducts, outside what the script sandbox allows.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  WombatTunnel:
    type: system-extension
    platform: macOS
    sources:
      - Tunnel
      - Shared
      - ExtensionShared
      - path: Vendor/WireGuardKit/Sources/WireGuardKit
      - path: Vendor/WireGuardKit/Sources/WireGuardKitC
        excludes: ["module.modulemap"]
    dependencies:
      - package: TunnelCore
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
    preBuildScripts:
      - name: Build wireguard-go bridge
        script: |
          ARCHS="$ARCHS" MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" "$PROJECT_DIR/scripts/build-wg-go.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/build/wg-go/libwg-go.a
    settings:
      base:
        PRODUCT_NAME: $(APP_BUNDLE_ID).tunnel
        PRODUCT_MODULE_NAME: WombatTunnel
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/Tunnel-Bridging-Header.h
        OTHER_LDFLAGS: $(PROJECT_DIR)/build/wg-go/libwg-go.a
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Cisco AnyConnect tunnels on libopenconnect (LGPL-2.1) + OpenSSL 3.5 LTS. A separate system
  # extension, so the OpenConnect C code never runs in the process that holds WireGuard keys.
  WombatOpenConnect:
    type: system-extension
    platform: macOS
    sources:
      - path: OpenConnect
        excludes: ["Info.plist", "OpenConnect.entitlements"]
      - Shared
      - ExtensionShared
      # The LGPL and OpenSSL license texts ship with the code they cover.
      - path: Vendor/openconnect/COPYING.LGPL
        buildPhase: resources
      - path: Vendor/openconnect/LICENSE.openssl
        buildPhase: resources
    dependencies:
      - package: TunnelCore
      - sdk: NetworkExtension.framework
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd
    preBuildScripts:
      - name: Build libopenconnect
        script: |
          ARCHS="$ARCHS" MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" "$PROJECT_DIR/scripts/build-openconnect.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/build/openconnect/lib/libopenconnect.a
    settings:
      base:
        PRODUCT_NAME: $(APP_BUNDLE_ID).openconnect
        PRODUCT_MODULE_NAME: WombatOpenConnect
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).openconnect
        INFOPLIST_FILE: OpenConnect/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenConnect/OpenConnect.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: OpenConnect/OpenConnect-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/build/openconnect/include/openconnect
        OTHER_LDFLAGS: $(PROJECT_DIR)/build/openconnect/lib/libopenconnect.a $(PROJECT_DIR)/build/openconnect/lib/libssl.a $(PROJECT_DIR)/build/openconnect/lib/libcrypto.a
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  wombat-cli:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Shared
    dependencies:
      - package: TunnelCore
    settings:
      base:
        PRODUCT_NAME: wombat
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).cli
        INFOPLIST_FILE: CLI/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: CLI/cli.entitlements
        SKIP_INSTALL: YES
        OTHER_CODE_SIGN_FLAGS: --identifier $(APP_BUNDLE_ID).cli
